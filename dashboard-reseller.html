<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050B18">
<title>Kelola Reseller | Dashboard Ibaadurrahmaan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="main-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- SweetAlert2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
/* ════════════════════════════════════════════════════════
   VARIABLES
════════════════════════════════════════════════════════ */
:root{
    --bg:#050B18;
    --bg-card:#0F1E33;
    --gold:#d4a536;
    --gold-glow:rgba(212,165,54,0.3);
    --text:#fff;
    --text-muted:#8a94a6;
    --border:rgba(255,255,255,0.08);
    --grad-card:linear-gradient(145deg,#0F1E33,#0A1626);
    --grad-gold-shine:linear-gradient(135deg,#d4a536,#e8bd52,#c19a2e);
    --radius-lg:16px;
    --ease:cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
    background-image:
        radial-gradient(circle at 10% 10%,rgba(212,165,54,0.08),transparent 40%),
        radial-gradient(circle at 90% 90%,rgba(212,165,54,0.05),transparent 40%);
}


/* ════════════════════════════════════════════════════════
   DASHBOARD HEADER
════════════════════════════════════════════════════════ */
.dashboard-header{
    background:linear-gradient(135deg,#0F1E33 0%,#050B18 100%);
    padding:32px 20px 40px;
    border-bottom:2px solid var(--gold);
    position:relative;
    overflow:hidden;
}

.dashboard-header::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,rgba(212,165,54,0.1),transparent 70%);
}

.header-container{
    max-width:1200px;
    margin:0 auto;
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.header-brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-logo{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    padding:4px;
    box-shadow:0 4px 15px var(--gold-glow);
    border:2px solid var(--gold);
    box-sizing:border-box;
    overflow:hidden;
    flex-shrink:0;
}

.header-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
}

.header-title h1{
    font-family:'Montserrat',sans-serif;
    font-size:1.3rem;
    font-weight:900;
    background:linear-gradient(135deg,var(--gold),#e8bd52);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:2px;
}

.header-title p{
    color:var(--text-muted);
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    padding:8px 14px 8px 8px;
    border-radius:100px;
}

.user-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#c19a2e);
    color:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:0.85rem;
    flex-shrink:0;
}

.user-name{
    font-size:0.82rem;
    font-weight:700;
    color:var(--text);
}

.logout-btn{
    background:rgba(231,76,60,0.15);
    border:1px solid rgba(231,76,60,0.3);
    color:#ff6b5b;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
    font-size:0.95rem;
}

.logout-btn:hover{
    background:#e74c3c;
    color:#fff;
    transform:scale(1.05);
}


/* ════════════════════════════════════════════════════════
   PAGE TITLE SECTION
════════════════════════════════════════════════════════ */
.page-title-section{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
}

.page-title-content{
    flex:1;
    min-width:200px;
}

.page-title-content h2{
    font-family:'Montserrat',sans-serif;
    font-size:1.5rem;
    font-weight:900;
    color:var(--text);
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:12px;
}

.page-title-content h2 i{
    color:var(--gold);
}

.page-title-content p{
    color:var(--text-muted);
    font-size:0.85rem;
}

.back-to-dashboard{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:0.85rem;
    font-weight:600;
    padding:10px 18px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
    border-radius:100px;
    border:1px solid var(--border);
    transition:all 0.3s var(--ease);
}

.back-to-dashboard:hover{
    color:var(--gold);
    border-color:var(--gold);
    background:rgba(212,165,54,0.08);
}


/* ════════════════════════════════════════════════════════
   MAIN
════════════════════════════════════════════════════════ */
.main{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px;
}


/* ════════════════════════════════════════════════════════
   SEARCH & FILTER
════════════════════════════════════════════════════════ */
.controls{
    background:linear-gradient(145deg,var(--bg-card),#0A1626);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

.search-wrapper{
    position:relative;
    margin-bottom:16px;
}

.search-input{
    width:100%;
    background:#0D1829;
    border:1.5px solid rgba(255,255,255,0.08);
    color:var(--text);
    padding:14px 16px 14px 48px;
    border-radius:12px;
    font-family:'Poppins',sans-serif;
    font-size:0.95rem;
    transition:all 0.3s;
}

.search-input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,165,54,0.1);
    background:#12233d;
}

.search-input::placeholder{color:var(--text-muted);}

.search-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold);
    font-size:1rem;
}

.search-clear{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:rgba(231,76,60,0.15);
    border:1px solid rgba(231,76,60,0.3);
    color:#e74c3c;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:0.75rem;
    transition:all 0.2s;
}

.search-clear.show{display:flex;}
.search-clear:hover{background:#e74c3c;color:#fff;}

.filter-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -ms-overflow-style:none;
    scrollbar-width:none;
}

.filter-tabs::-webkit-scrollbar{display:none;}

.filter-tab{
    padding:10px 18px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:100px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.3s;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    font-family:'Poppins',sans-serif;
    flex-shrink:0;
}

.filter-tab:hover{
    background:rgba(212,165,54,0.1);
    color:var(--gold);
    border-color:rgba(212,165,54,0.2);
}

.filter-tab.active{
    background:linear-gradient(135deg,var(--gold),#c19a2e);
    color:var(--bg);
    border-color:var(--gold);
    box-shadow:0 4px 12px var(--gold-glow);
}

.filter-tab .count{
    background:rgba(0,0,0,0.15);
    padding:2px 8px;
    border-radius:100px;
    font-size:0.72rem;
    font-weight:800;
}

.filter-tab:not(.active) .count{
    background:rgba(212,165,54,0.15);
    color:var(--gold);
}


/* ════════════════════════════════════════════════════════
   RESULT INFO
════════════════════════════════════════════════════════ */
.result-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 4px;
    color:var(--text-muted);
    font-size:0.85rem;
}

.result-count{
    display:flex;
    align-items:center;
    gap:6px;
}

.result-count b{
    color:var(--gold);
    font-weight:800;
}


/* ════════════════════════════════════════════════════════
   RESELLER GRID & CARDS
════════════════════════════════════════════════════════ */
.reseller-grid{
    display:grid;
    gap:12px;
    margin-bottom:24px;
}

.reseller-card{
    background:linear-gradient(145deg,var(--bg-card),#0A1626);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    transition:all 0.3s;
    position:relative;
    overflow:hidden;
}

.reseller-card:hover{
    border-color:rgba(212,165,54,0.3);
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.reseller-card.status-pending{border-left:3px solid #f39c12;}
.reseller-card.status-active{border-left:3px solid #25d366;}
.reseller-card.status-inactive{border-left:3px solid #f39c12;}
.reseller-card.status-rejected{border-left:3px solid #e74c3c;}

.card-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
}

.card-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#c19a2e);
    color:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:1.1rem;
    flex-shrink:0;
}

.card-info{flex:1;min-width:0;}

.card-name{
    font-weight:700;
    color:var(--text);
    font-size:1rem;
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-code{
    font-family:'Montserrat',monospace;
    background:rgba(212,165,54,0.1);
    color:var(--gold);
    padding:3px 10px;
    border-radius:6px;
    font-size:0.72rem;
    font-weight:700;
    display:inline-block;
}

.card-status{
    padding:5px 12px;
    border-radius:100px;
    font-size:0.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    flex-shrink:0;
}

.card-status.pending{background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.3);}
.card-status.active{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3);}
.card-status.inactive{background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.3);}
.card-status.rejected{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid rgba(231,76,60,0.3);}

.card-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:12px;
    background:rgba(255,255,255,0.02);
    border-radius:10px;
    margin-bottom:12px;
    font-size:0.78rem;
}

.card-meta-item{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-muted);
    min-width:0;
}

.card-meta-item i{
    color:var(--gold);
    font-size:0.85rem;
    flex-shrink:0;
}

.card-meta-item span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.card-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.card-btn{
    flex:1;
    min-width:80px;
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-family:'Poppins',sans-serif;
    font-size:0.78rem;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:all 0.2s;
}

.card-btn i{font-size:0.85rem;}

.card-btn.detail{background:rgba(52,152,219,0.15);color:#3498db;border:1px solid rgba(52,152,219,0.3);}
.card-btn.detail:hover{background:#3498db;color:#fff;}

.card-btn.edit{background:rgba(212,165,54,0.15);color:#d4a536;border:1px solid rgba(212,165,54,0.3);}
.card-btn.edit:hover{background:#d4a536;color:#050B18;}

.card-btn.approve{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3);}
.card-btn.approve:hover{background:#25d366;color:#fff;}

.card-btn.reject{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid rgba(231,76,60,0.3);}
.card-btn.reject:hover{background:#e74c3c;color:#fff;}

.card-btn.deactivate{background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.3);}
.card-btn.deactivate:hover{background:#f39c12;color:#fff;}

.card-btn.reactivate{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3);}
.card-btn.reactivate:hover{background:#25d366;color:#fff;}

.card-btn.delete{background:rgba(150,40,27,0.2);color:#c0392b;border:1px solid rgba(150,40,27,0.4);}
.card-btn.delete:hover{background:#c0392b;color:#fff;}

.empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
}

.empty-state i{
    font-size:4rem;
    opacity:0.3;
    margin-bottom:16px;
    color:var(--gold);
}

.empty-state h3{
    font-family:'Montserrat',sans-serif;
    color:var(--text);
    margin-bottom:8px;
}

.empty-state p{font-size:0.9rem;line-height:1.6;}


/* ════════════════════════════════════════════════════════
   BOTTOM NAVBAR
════════════════════════════════════════════════════════ */
.bottom-nav{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(15,30,51,0.95);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:100px;
    padding:10px 14px;
    display:flex;
    gap:6px;
    z-index:1000;
    box-shadow:0 10px 40px rgba(0,0,0,0.4),0 0 30px rgba(212,165,54,0.15);
    max-width:calc(100% - 32px);
    overflow-x:auto;
    -ms-overflow-style:none;
    scrollbar-width:none;
}

.bottom-nav::-webkit-scrollbar{display:none;}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:8px 14px;
    color:var(--text-muted);
    text-decoration:none;
    border-radius:100px;
    font-size:0.68rem;
    font-weight:700;
    transition:all 0.3s ease;
    min-width:64px;
    cursor:pointer;
    flex-shrink:0;
    font-family:'Poppins',sans-serif;
    border:none;
    background:transparent;
    letter-spacing:0.3px;
}

.nav-item i{font-size:1.1rem;transition:transform 0.3s ease;}
.nav-item:hover{color:var(--gold);}
.nav-item:hover i{transform:translateY(-2px);}

.nav-item.active{
    background:linear-gradient(135deg,var(--gold),#c19a2e);
    color:var(--bg);
    box-shadow:0 4px 12px var(--gold-glow);
}

.nav-item.active i{color:var(--bg);}


/* ════════════════════════════════════════════════════════
   SWEETALERT PREMIUM
════════════════════════════════════════════════════════ */
.swal-premium{
    background:linear-gradient(145deg,#0F1E33,#0A1626) !important;
    border:1px solid rgba(212,165,54,0.3) !important;
    border-radius:20px !important;
    box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(212,165,54,0.15) !important;
    color:#fff !important;
    font-family:'Poppins',sans-serif !important;
}

.swal-premium .swal2-title{
    color:#d4a536 !important;
    font-family:'Montserrat',sans-serif !important;
    font-weight:800 !important;
    font-size:1.4rem !important;
}

.swal-premium .swal2-html-container{
    color:rgba(255,255,255,0.85) !important;
    font-size:0.95rem !important;
    line-height:1.6 !important;
}

.swal-premium .swal2-input,
.swal-premium .swal2-textarea,
.swal-premium .swal2-select{
    background:#0D1829 !important;
    border:1.5px solid rgba(212,165,54,0.2) !important;
    color:#fff !important;
    border-radius:10px !important;
    font-family:'Poppins',sans-serif !important;
}

.swal-premium .swal2-input:focus,
.swal-premium .swal2-textarea:focus,
.swal-premium .swal2-select:focus{
    border-color:#d4a536 !important;
    box-shadow:0 0 0 3px rgba(212,165,54,0.1) !important;
}

.swal-premium .swal2-icon{border-color:#d4a536 !important;color:#d4a536 !important;}
.swal-premium .swal2-icon.swal2-success{border-color:#25d366 !important;}
.swal-premium .swal2-icon.swal2-success .swal2-success-line-tip,
.swal-premium .swal2-icon.swal2-success .swal2-success-line-long{background-color:#25d366 !important;}
.swal-premium .swal2-icon.swal2-success .swal2-success-ring{border-color:rgba(37,211,102,0.3) !important;}
.swal-premium .swal2-icon.swal2-error{border-color:#e74c3c !important;color:#e74c3c !important;}
.swal-premium .swal2-icon.swal2-error [class^=swal2-x-mark-line]{background-color:#e74c3c !important;}
.swal-premium .swal2-icon.swal2-warning{border-color:#f39c12 !important;color:#f39c12 !important;}
.swal-premium .swal2-icon.swal2-info{border-color:#3498db !important;color:#3498db !important;}
.swal-premium .swal2-icon.swal2-question{border-color:#d4a536 !important;color:#d4a536 !important;}

.swal-premium .swal2-confirm{
    background:linear-gradient(135deg,#d4a536,#c19a2e) !important;
    color:#050B18 !important;
    border:none !important;
    border-radius:100px !important;
    padding:12px 30px !important;
    font-weight:800 !important;
    font-family:'Poppins',sans-serif !important;
    font-size:0.9rem !important;
    box-shadow:0 6px 20px rgba(212,165,54,0.4) !important;
    text-transform:uppercase !important;
    letter-spacing:0.5px !important;
    transition:all 0.3s ease !important;
}

.swal-premium .swal2-confirm:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 8px 25px rgba(212,165,54,0.5) !important;
}

.swal-premium .swal2-cancel{
    background:rgba(255,255,255,0.08) !important;
    color:#fff !important;
    border:1px solid rgba(255,255,255,0.15) !important;
    border-radius:100px !important;
    padding:12px 30px !important;
    font-weight:700 !important;
    font-family:'Poppins',sans-serif !important;
    font-size:0.9rem !important;
    text-transform:uppercase !important;
    letter-spacing:0.5px !important;
    margin-right:12px !important;
}

.swal-premium .swal2-cancel:hover{
    background:rgba(231,76,60,0.15) !important;
    border-color:rgba(231,76,60,0.4) !important;
    color:#ff6b5b !important;
}

.swal-premium .swal2-timer-progress-bar{background:linear-gradient(90deg,#d4a536,#e8bd52) !important;height:4px !important;}
.swal-premium .swal2-close{color:rgba(255,255,255,0.4) !important;font-size:2rem !important;}
.swal-premium .swal2-close:hover{color:#d4a536 !important;transform:rotate(90deg) !important;}
.swal-premium .swal2-validation-message{background:rgba(231,76,60,0.1) !important;color:#ff6b5b !important;border-radius:8px !important;}


/* ════════════════════════════════════════════════════════
   REWARD INTEGRATION — Admin Dashboard
════════════════════════════════════════════════════════ */
.card-progress-info{
    display:flex;
    gap:10px;
    padding:10px 12px;
    background:rgba(212,165,54,0.05);
    border:1px solid rgba(212,165,54,0.15);
    border-radius:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
    font-size:0.75rem;
}

.progress-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:var(--text-muted);
    font-weight:600;
}

.progress-badge i{color:var(--gold);font-size:0.85rem;}

.progress-badge.reward-pending{
    color:#f39c12;
    background:rgba(243,156,18,0.1);
    padding:2px 8px;
    border-radius:6px;
}

.progress-badge.reward-paid{
    color:#25d366;
    background:rgba(37,211,102,0.1);
    padding:2px 8px;
    border-radius:6px;
}

.card-btn.reward{
    background:linear-gradient(135deg, rgba(212,165,54,0.2), rgba(212,165,54,0.1));
    color:#d4a536;
    border:1px solid rgba(212,165,54,0.4);
    position:relative;
}

.card-btn.reward:hover{
    background:linear-gradient(135deg, #d4a536, #c19a2e);
    color:#050B18;
}

.card-btn.reward .badge-notif{
    position:absolute;
    top:-6px;
    right:-6px;
    background:#e74c3c;
    color:#fff;
    font-size:0.6rem;
    font-weight:800;
    padding:2px 6px;
    border-radius:100px;
    border:2px solid var(--bg-card);
}

/* Reward Modal */
.swal-reward-content{text-align:left;color:#fff;font-family:'Poppins',sans-serif;}

.reward-modal-section{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}

.reward-modal-title{
    font-size:0.75rem;
    font-weight:800;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
}

.reward-progress-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:0.85rem;
}

.reward-progress-item .label{min-width:80px;color:rgba(255,255,255,0.85);font-weight:600;}

.reward-progress-item .bar{
    flex:1;
    height:8px;
    background:rgba(255,255,255,0.08);
    border-radius:99px;
    overflow:hidden;
}

.reward-progress-item .bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), #e8bd52);
    border-radius:99px;
    transition:width 0.5s;
}

.reward-progress-item .value{
    min-width:55px;
    text-align:right;
    color:var(--gold);
    font-weight:800;
    font-size:0.8rem;
}

.reward-tier-card{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
}

.reward-tier-card.earned{
    border-color:rgba(37,211,102,0.4);
    background:linear-gradient(135deg, rgba(37,211,102,0.08), rgba(255,255,255,0.02));
}

.reward-tier-card.paid{
    border-color:rgba(212,165,54,0.4);
    background:linear-gradient(135deg, rgba(212,165,54,0.1), rgba(255,255,255,0.02));
}

.reward-tier-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.reward-tier-name{font-size:0.9rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
.reward-tier-amount{font-size:1rem;font-weight:900;color:var(--gold);}
.reward-tier-desc{font-size:0.75rem;color:var(--text-muted);margin-bottom:10px;}

.reward-tier-status{font-size:0.75rem;padding:5px 10px;border-radius:100px;font-weight:700;display:inline-block;}
.status-locked-tier{background:rgba(255,255,255,0.05);color:var(--text-muted);}
.status-earned-tier{background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.3);}
.status-paid-tier{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3);}

.btn-mark-paid{
    background:linear-gradient(135deg, #25d366, #128c7e);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:0.8rem;
    font-family:'Poppins',sans-serif;
    margin-top:8px;
    transition:all 0.2s;
}

.btn-mark-paid:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,211,102,0.4);}

.reward-summary{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-top:12px;}

.summary-box{background:rgba(0,0,0,0.3);border-radius:10px;padding:10px;text-align:center;}
.summary-box .label{font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.summary-box .value{font-size:0.85rem;font-weight:800;color:#fff;}
.summary-box.pending .value{color:#f39c12;}
.summary-box.paid .value{color:#25d366;}

.btn-send-link{
    width:100%;
    background:linear-gradient(135deg, #25D366, #128C7E);
    color:#fff;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
    font-size:0.85rem;
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:12px;
    transition:all 0.3s;
}

.btn-send-link:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,211,102,0.4);}

<!-- ════════════════════════════════════════════════════════
     SCRIPT 3: PAGE-SPECIFIC LOGIC (Reseller Management)
════════════════════════════════════════════════════════ -->
<script>
// ============================================================
// 📋 RESELLER MANAGEMENT PAGE
// ============================================================

let allResellers = [];
let filteredResellers = [];
let currentFilter = 'all';
let searchQuery = '';


// ── LOAD RESELLERS ──────────────────────────────────
async function loadResellers() {
    try {
        await waitForFirebase();
        
        console.log('[RESELLER PAGE] Loading resellers...');
        
        const { db, collection, getDocs } = window.firebase;
        const snapshot = await getDocs(collection(db, 'resellers'));
        
        allResellers = [];
        snapshot.forEach(docSnap => {
            allResellers.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        allResellers.sort((a, b) => {
            const t1 = a.timestamp?.toDate?.().getTime() || 0;
            const t2 = b.timestamp?.toDate?.().getTime() || 0;
            return t2 - t1;
        });
        
        updateCounts();
        applyFilters();
        
        console.log('[RESELLER PAGE] ✅ Loaded:', allResellers.length, 'resellers');
        
    } catch (error) {
        console.error('[RESELLER PAGE] ❌ Error:', error);
        
        let errorMsg = error.message;
        let solution = 'Coba refresh halaman';
        
        if (error.code === 'permission-denied' || error.message.includes('permission')) {
            errorMsg = 'Akses ditolak oleh Firestore Rules';
            solution = 'Update Firestore Rules → allow read: if true;';
        }
        
        document.getElementById('resellerGrid').innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i>
                <h3>Gagal Memuat Data</h3>
                <p><strong style="color:#e74c3c;">${errorMsg}</strong><br><br>
                <small style="color:#f39c12;">💡 ${solution}</small></p>
            </div>
        `;
    }
}


// ── UPDATE COUNTS ──────────────────────────────────
function updateCounts() {
    document.getElementById('countAll').textContent = allResellers.length;
    document.getElementById('countPending').textContent = allResellers.filter(r => r.status === 'pending').length;
    document.getElementById('countActive').textContent = allResellers.filter(r => r.status === 'active').length;
    document.getElementById('countInactive').textContent = allResellers.filter(r => r.status === 'inactive').length;
    document.getElementById('countRejected').textContent = allResellers.filter(r => r.status === 'rejected').length;
    document.getElementById('totalCount').textContent = allResellers.length;
}


// ── APPLY FILTERS ──────────────────────────────────
function applyFilters() {
    let result = currentFilter === 'all' 
        ? [...allResellers] 
        : allResellers.filter(r => r.status === currentFilter);
    
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        result = result.filter(r => 
            (r.nama || '').toLowerCase().includes(q) ||
            (r.resellerCode || '').toLowerCase().includes(q) ||
            (r.wa || '').toLowerCase().includes(q) ||
            (r.email || '').toLowerCase().includes(q)
        );
    }
    
    filteredResellers = result;
    document.getElementById('visibleCount').textContent = result.length;
    renderResellers(result);
}


// ── RENDER RESELLER CARDS (With Reward Integration) ──
function renderResellers(resellers) {
    const grid = document.getElementById('resellerGrid');
    
    if (resellers.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>Tidak Ada Data</h3>
                <p>${searchQuery ? 'Tidak ada reseller yang cocok dengan pencarian' : 'Belum ada reseller di kategori ini'}</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    resellers.forEach(data => {
        const initial = (data.nama || '?').charAt(0).toUpperCase();
        const status = data.status || 'pending';
        
        let dateStr = '-';
        if (data.timestamp?.toDate) {
            const date = data.timestamp.toDate();
            dateStr = date.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
        }
        
        // ⭐ REWARD INFO
        const progress = data.progress || {};
        const modulesDone = (progress.modulesDone || []).length;
        const sopDone = (progress.sopDone || []).length;
        
        const rewards = data.rewards || {};
        const tier1 = rewards.tier1 || {};
        const tier2 = rewards.tier2 || {};
        
        const totalEarned = (tier1.earned ? 50000 : 0) + (tier2.earned ? 100000 : 0);
        const totalPaid = (tier1.paid ? 50000 : 0) + (tier2.paid ? 100000 : 0);
        const totalPending = totalEarned - totalPaid;
        
        // Progress info bar (only for active)
        let progressInfoHTML = '';
        if (status === 'active') {
            let rewardBadge = '';
            if (totalPending > 0) {
                rewardBadge = `<span class="progress-badge reward-pending">
                    <i class="fas fa-money-bill-wave"></i> Rp ${totalPending.toLocaleString('id-ID')} BELUM BAYAR
                </span>`;
            } else if (totalPaid > 0) {
                rewardBadge = `<span class="progress-badge reward-paid">
                    <i class="fas fa-check-circle"></i> Rp ${totalPaid.toLocaleString('id-ID')} PAID
                </span>`;
            }
            
            progressInfoHTML = `
                <div class="card-progress-info">
                    <span class="progress-badge"><i class="fas fa-graduation-cap"></i> ${modulesDone}/15</span>
                    <span class="progress-badge"><i class="fas fa-clipboard-check"></i> ${sopDone}/6</span>
                    ${rewardBadge}
                </div>
            `;
        }
        
        // Data untuk onclick
        const dataStr = JSON.stringify({
            id: data.id,
            nama: data.nama || 'Tanpa Nama',
            wa: data.wa || '',
            resellerCode: data.resellerCode || '-'
        }).replace(/"/g, '&quot;');
        
        // Buttons berdasarkan status
        let buttons = '';
        if (status === 'pending') {
            buttons = `
                <button class="card-btn approve" onclick='handleApprove(${dataStr})'>
                    <i class="fas fa-check"></i>Approve
                </button>
                <button class="card-btn edit" onclick='handleEdit(${dataStr})'>
                    <i class="fas fa-edit"></i>Edit
                </button>
                <button class="card-btn reject" onclick='handleReject(${dataStr})'>
                    <i class="fas fa-times"></i>Reject
                </button>
            `;
        } else if (status === 'active') {
            const notifBadge = totalPending > 0 ? '<span class="badge-notif">!</span>' : '';
            buttons = `
                <button class="card-btn reward" onclick='handleReward("${data.id}")'>
                    <i class="fas fa-trophy"></i>Reward${notifBadge}
                </button>
                <button class="card-btn edit" onclick='handleEdit(${dataStr})'>
                    <i class="fas fa-edit"></i>Edit
                </button>
                <button class="card-btn deactivate" onclick='handleDeactivate(${dataStr})'>
                    <i class="fas fa-user-slash"></i>Non-Aktif
                </button>
            `;
        } else if (status === 'inactive') {
            buttons = `
                <button class="card-btn reactivate" onclick='handleReactivate(${dataStr})'>
                    <i class="fas fa-user-check"></i>Aktifkan
                </button>
                <button class="card-btn edit" onclick='handleEdit(${dataStr})'>
                    <i class="fas fa-edit"></i>Edit
                </button>
                <button class="card-btn delete" onclick='handleDelete(${dataStr})'>
                    <i class="fas fa-trash-alt"></i>Hapus
                </button>
            `;
        } else if (status === 'rejected') {
            buttons = `
                <button class="card-btn detail" onclick='handleDetail(${dataStr})'>
                    <i class="fas fa-eye"></i>Detail
                </button>
                <button class="card-btn delete" onclick='handleDelete(${dataStr})'>
                    <i class="fas fa-trash-alt"></i>Hapus Permanen
                </button>
            `;
        }
        
        html += `
            <div class="reseller-card status-${status}">
                <div class="card-header">
                    <div class="card-avatar">${initial}</div>
                    <div class="card-info">
                        <div class="card-name">${data.nama || 'Tanpa Nama'}</div>
                        <span class="card-code">${data.resellerCode || '-'}</span>
                    </div>
                    <span class="card-status ${status}">${status}</span>
                </div>
                
                ${progressInfoHTML}
                
                <div class="card-meta">
                    <div class="card-meta-item">
                        <i class="fab fa-whatsapp"></i>
                        <span>${data.wa || '-'}</span>
                    </div>
                    <div class="card-meta-item">
                        <i class="fas fa-envelope"></i>
                        <span>${data.email || '-'}</span>
                    </div>
                    <div class="card-meta-item">
                        <i class="fas fa-university"></i>
                        <span>${data.bank || '-'}</span>
                    </div>
                    <div class="card-meta-item">
                        <i class="fas fa-calendar"></i>
                        <span>${dateStr}</span>
                    </div>
                </div>
                
                <div class="card-actions">${buttons}</div>
            </div>
        `;
    });
    
    grid.innerHTML = html;
}


// ── SEARCH INPUT ──────────────────────────────────
document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    document.getElementById('searchClear').classList.toggle('show', searchQuery.length > 0);
    applyFilters();
});

function clearSearch() {
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    document.getElementById('searchClear').classList.remove('show');
    applyFilters();
}


// ── FILTER TABS ──────────────────────────────────
document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.status;
        applyFilters();
    });
});


// ── AUTO LOAD ──────────────────────────────────
document.addEventListener('firebaseReady', () => {
    console.log('[RESELLER PAGE] Firebase ready → load data');
    loadResellers();
});

setTimeout(() => {
    if (window.firebase?.ready && allResellers.length === 0) {
        console.log('[RESELLER PAGE] Fallback load...');
        loadResellers();
    }
}, 1500);
</script>


<!-- ════════════════════════════════════════════════════════
     SCRIPT 4: 🏆 REWARD HANDLER — Admin Modal
════════════════════════════════════════════════════════ -->
<script>
// ── REWARD MODAL ──────────────────────────────────
async function handleReward(resellerId) {
    const reseller = allResellers.find(r => r.id === resellerId);
    if (!reseller) {
        Swal.fire({title:'Error', text:'Data tidak ditemukan', icon:'error', customClass:{popup:'swal-premium'}});
        return;
    }
    
    const progress = reseller.progress || {};
    const modulesDone = (progress.modulesDone || []).length;
    const sopDone = (progress.sopDone || []).length;
    const modulesPct = (modulesDone / 15) * 100;
    const sopPct = (sopDone / 6) * 100;
    
    const rewards = reseller.rewards || {};
    const tier1 = rewards.tier1 || { earned: false, amount: 50000, paid: false };
    const tier2 = rewards.tier2 || { earned: false, amount: 100000, paid: false };
    
    const totalEarned = (tier1.earned ? 50000 : 0) + (tier2.earned ? 100000 : 0);
    const totalPaid = (tier1.paid ? 50000 : 0) + (tier2.paid ? 100000 : 0);
    const totalPending = totalEarned - totalPaid;
    
    const fmtDate = (ts) => {
        if (!ts) return '-';
        try {
            const d = ts.toDate ? ts.toDate() : new Date(ts.seconds ? ts.seconds*1000 : ts);
            return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
        } catch(e) { return '-'; }
    };
    
    const tier1HTML = `
        <div class="reward-tier-card ${tier1.paid ? 'paid' : (tier1.earned ? 'earned' : '')}">
            <div class="reward-tier-header">
                <div class="reward-tier-name">🥈 Tier 1 — Belajar Selesai</div>
                <div class="reward-tier-amount">Rp 50.000</div>
            </div>
            <div class="reward-tier-desc">Syarat: Selesai 15 modul</div>
            ${!tier1.earned ? `
                <span class="reward-tier-status status-locked-tier">
                    🔒 Progress: ${modulesDone}/15 modul
                </span>
            ` : tier1.paid ? `
                <span class="reward-tier-status status-paid-tier">
                    ✅ SUDAH DIBAYAR — ${fmtDate(tier1.paidAt)}
                </span>
            ` : `
                <span class="reward-tier-status status-earned-tier">
                    💰 EARNED ${fmtDate(tier1.earnedAt)} — BELUM DIBAYAR
                </span>
                <br>
                <button class="btn-mark-paid" onclick="markRewardPaid('${resellerId}', 'tier1')">
                    <i class="fas fa-check-circle"></i> Tandai Sudah Dibayar
                </button>
            `}
        </div>
    `;
    
    const tier2HTML = `
        <div class="reward-tier-card ${tier2.paid ? 'paid' : (tier2.earned ? 'earned' : '')}">
            <div class="reward-tier-header">
                <div class="reward-tier-name">🥇 Tier 2 — Siap Jualan</div>
                <div class="reward-tier-amount">Rp 100.000</div>
            </div>
            <div class="reward-tier-desc">Syarat: Selesai 15 modul + 6 SOP</div>
            ${!tier2.earned ? `
                <span class="reward-tier-status status-locked-tier">
                    🔒 Modul: ${modulesDone}/15 | SOP: ${sopDone}/6
                </span>
            ` : tier2.paid ? `
                <span class="reward-tier-status status-paid-tier">
                    ✅ SUDAH DIBAYAR — ${fmtDate(tier2.paidAt)}
                </span>
            ` : `
                <span class="reward-tier-status status-earned-tier">
                    💰 EARNED ${fmtDate(tier2.earnedAt)} — BELUM DIBAYAR
                </span>
                <br>
                <button class="btn-mark-paid" onclick="markRewardPaid('${resellerId}', 'tier2')">
                    <i class="fas fa-check-circle"></i> Tandai Sudah Dibayar
                </button>
            `}
        </div>
    `;
    
    const contentHTML = `
        <div class="swal-reward-content">
            <div class="reward-modal-section">
                <div class="reward-modal-title"><i class="fas fa-chart-bar"></i> Progress</div>
                <div class="reward-progress-item">
                    <span class="label">📚 Modul</span>
                    <div class="bar"><div class="bar-fill" style="width:${modulesPct}%"></div></div>
                    <span class="value">${modulesDone}/15</span>
                </div>
                <div class="reward-progress-item">
                    <span class="label">📋 SOP</span>
                    <div class="bar"><div class="bar-fill" style="width:${sopPct}%"></div></div>
                    <span class="value">${sopDone}/6</span>
                </div>
            </div>
            
            <div class="reward-modal-section">
                <div class="reward-modal-title"><i class="fas fa-trophy"></i> Reward Status</div>
                ${tier1HTML}
                ${tier2HTML}
            </div>
            
            <div class="reward-modal-section">
                <div class="reward-modal-title"><i class="fas fa-money-check-alt"></i> Ringkasan</div>
                <div class="reward-summary">
                    <div class="summary-box">
                        <div class="label">Earned</div>
                        <div class="value">Rp ${totalEarned.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="summary-box paid">
                        <div class="label">Paid</div>
                        <div class="value">Rp ${totalPaid.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="summary-box pending">
                        <div class="label">Pending</div>
                        <div class="value">Rp ${totalPending.toLocaleString('id-ID')}</div>
                    </div>
                </div>
                
                <button class="btn-send-link" onclick="sendStarterKitLink('${reseller.wa || ''}', '${(reseller.nama||'').replace(/'/g,'')}', '${reseller.resellerCode || ''}')">
                    <i class="fab fa-whatsapp"></i> Kirim Link Starter Kit ke WA
                </button>
            </div>
        </div>
    `;
    
    Swal.fire({
        title: `🏆 ${reseller.nama || 'Reseller'}`,
        html: contentHTML,
        showCloseButton: true,
        showConfirmButton: false,
        width: '600px',
        customClass: { popup: 'swal-premium' }
    });
}


// ── MARK REWARD AS PAID ──────────────────────────────────
async function markRewardPaid(resellerId, tier) {
    const result = await Swal.fire({
        title: 'Konfirmasi Pembayaran',
        text: `Yakin sudah transfer reward ${tier === 'tier1' ? 'Rp 50.000' : 'Rp 100.000'} ke reseller?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '✅ Ya, Sudah Bayar',
        cancelButtonText: 'Batal',
        customClass: { popup: 'swal-premium' }
    });
    
    if (!result.isConfirmed) return;
    
    try {
        const { db, doc, updateDoc } = window.firebase;
        
        const updateData = {};
        updateData[`rewards.${tier}.paid`] = true;
        updateData[`rewards.${tier}.paidAt`] = new Date();
        
        await updateDoc(doc(db, 'resellers', resellerId), updateData);
        
        // Update local state
        const idx = allResellers.findIndex(r => r.id === resellerId);
        if (idx !== -1) {
            allResellers[idx].rewards = allResellers[idx].rewards || {};
            allResellers[idx].rewards[tier] = allResellers[idx].rewards[tier] || {};
            allResellers[idx].rewards[tier].paid = true;
            allResellers[idx].rewards[tier].paidAt = new Date();
        }
        
        Swal.fire({
            title: '✅ Berhasil!',
            text: 'Reward berhasil ditandai sebagai sudah dibayar',
            icon: 'success',
            timer: 2000,
            showConfirmButton: false,
            customClass: { popup: 'swal-premium' }
        });
        
        // Refresh view
        applyFilters();
        setTimeout(() => handleReward(resellerId), 1000);
        
    } catch (err) {
        console.error('[MARK PAID] Error:', err);
        Swal.fire({
            title: 'Gagal!',
            text: 'Terjadi kesalahan: ' + err.message,
            icon: 'error',
            customClass: { popup: 'swal-premium' }
        });
    }
}


// ── KIRIM LINK STARTER KIT VIA WA ──────────────────────────────────
function sendStarterKitLink(wa, nama, code) {
    if (!wa || !code) {
        Swal.fire({title:'Error', text:'Data WA atau kode reseller tidak lengkap', icon:'error', customClass:{popup:'swal-premium'}});
        return;
    }
    
    // Format nomor WA
    let phone = wa.replace(/[^0-9]/g, '');
    if (phone.startsWith('0')) phone = '62' + phone.substring(1);
    if (!phone.startsWith('62')) phone = '62' + phone;
    
    const baseURL = 'https://ibaadurrahmaan-hub.github.io';
    const starterKitURL = `${baseURL}/starter-kit.html?code=${code}`;
    
    const message = `Halo ${nama}! 🎉

Selamat, kamu sudah terdaftar sebagai reseller Ibaadurrahmaan!

📚 *Yuk mulai belajar & earn reward!*
${starterKitURL}

🏆 *Reward yang menanti kamu:*
🥈 Rp 50.000 — Setelah selesai 15 modul
🥇 Rp 100.000 — Setelah selesai 15 modul + 6 SOP

Progress kamu akan tersimpan otomatis di sistem kami.
Setelah earn reward, admin akan hubungi kamu untuk transfer.

Semangat belajar! 🚀

_— Tim Ibaadurrahmaan_`;
    
    const waURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(waURL, '_blank');
}


// Expose functions ke window scope
window.handleReward = handleReward;
window.markRewardPaid = markRewardPaid;
window.sendStarterKitLink = sendStarterKitLink;

console.log('[REWARD HANDLER] ✅ Loaded');
</script>

</body>
</html>
