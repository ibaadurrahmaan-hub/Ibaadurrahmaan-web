<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050B18">
<title>Kelola Client | Dashboard Ibaadurrahmaan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="main-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- SweetAlert2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
/* ====================================================
   👥 CLIENT MANAGEMENT STYLES
   ==================================================== */
.client-page{
    background:var(--bg);
    min-height:100vh;
    padding-bottom:100px;
}


/* ==================== DASHBOARD HEADER ==================== */
.dashboard-header{
    background:linear-gradient(135deg,#0F1E33 0%,#050B18 100%);
    padding:32px 20px 40px;
    border-bottom:2px solid var(--gold);
    position:relative;
    overflow:hidden;
}

.dashboard-header::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,rgba(212,165,54,0.1),transparent 70%);
}

.header-container{
    max-width:1200px;
    margin:0 auto;
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.header-brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.header-logo{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    padding:4px;
    box-shadow:0 4px 15px var(--gold-glow);
    border:2px solid var(--gold);
    box-sizing:border-box;
    overflow:hidden;
    flex-shrink:0;
}

.header-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
}

.header-title h1{
    font-family:'Montserrat',sans-serif;
    font-size:1.3rem;
    font-weight:900;
    background:linear-gradient(135deg,var(--gold),#e8bd52);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:2px;
}

.header-title p{
    color:var(--text-muted);
    font-size:0.78rem;
    letter-spacing:0.5px;
    text-transform:uppercase;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    padding:8px 14px 8px 8px;
    border-radius:100px;
}

.user-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),#c19a2e);
    color:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:0.85rem;
    flex-shrink:0;
}

.user-name{
    font-size:0.82rem;
    font-weight:700;
    color:var(--text);
}

.logout-btn{
    background:rgba(231,76,60,0.15);
    border:1px solid rgba(231,76,60,0.3);
    color:#ff6b5b;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
    font-size:0.95rem;
}

.logout-btn:hover{
    background:#e74c3c;
    color:#fff;
    transform:scale(1.05);
}


/* ==================== PAGE TITLE SECTION ==================== */
.page-title-section{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
}

.page-title-content{
    flex:1;
    min-width:200px;
}

.page-title-content h2{
    font-family:'Montserrat',sans-serif;
    font-size:1.5rem;
    font-weight:900;
    color:var(--text);
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:12px;
}

.page-title-content h2 i{
    color:var(--gold);
}

.page-title-content p{
    color:var(--text-muted);
    font-size:0.85rem;
}

.back-to-dashboard{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:0.85rem;
    font-weight:600;
    padding:10px 18px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
    border-radius:100px;
    border:1px solid var(--border);
    transition:all 0.3s var(--ease);
}

.back-to-dashboard:hover{
    color:var(--gold);
    border-color:var(--gold);
    background:rgba(212,165,54,0.08);
}


/* ==================== MAIN CONTAINER ==================== */
.client-container{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 40px;
}


/* ==================== STATS GRID ==================== */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:28px;
}

.stat-card{
    background:var(--grad-card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    text-align:center;
    transition:all 0.3s var(--ease);
    position:relative;
    overflow:hidden;
}

.stat-card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
}

.stat-card.s-total::before{ background:linear-gradient(90deg,var(--gold),#e8bd52); }
.stat-card.s-active::before{ background:linear-gradient(90deg,#25d366,#1eb85a); }
.stat-card.s-progress::before{ background:linear-gradient(90deg,#3498db,#2980b9); }
.stat-card.s-done::before{ background:linear-gradient(90deg,#9b59b6,#8e44ad); }

.stat-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
}

.stat-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    margin:0 auto 12px;
}

.s-total .stat-icon{ background:rgba(212,165,54,0.15); color:var(--gold); }
.s-active .stat-icon{ background:rgba(37,211,102,0.15); color:#25d366; }
.s-progress .stat-icon{ background:rgba(52,152,219,0.15); color:#3498db; }
.s-done .stat-icon{ background:rgba(155,89,182,0.15); color:#9b59b6; }

.stat-number{
    font-family:'Montserrat',sans-serif;
    font-size:2rem;
    font-weight:900;
    line-height:1;
    margin-bottom:4px;
}

.s-total .stat-number{ color:var(--gold); }
.s-active .stat-number{ color:#25d366; }
.s-progress .stat-number{ color:#3498db; }
.s-done .stat-number{ color:#9b59b6; }

.stat-label{
    color:var(--text-muted);
    font-size:0.75rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
}


/* ==================== TOOLBAR ==================== */
.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
    align-items:center;
}

.search-wrap{
    flex:1;
    min-width:220px;
    position:relative;
}

.search-wrap i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
    font-size:0.9rem;
    pointer-events:none;
}

.search-wrap input{
    width:100%;
    padding:13px 14px 13px 42px;
    background:#0D1829;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    color:var(--text);
    font-size:0.9rem;
    font-family:'Poppins',sans-serif;
    transition:all 0.3s var(--ease);
    outline:none;
    box-sizing:border-box;
}

.search-wrap input:focus{
    background:#12233d;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,165,54,0.1);
}

.search-wrap input::placeholder{ color:var(--text-muted); }

.filter-select{
    padding:13px 16px;
    background:#0D1829;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    color:var(--text);
    font-size:0.85rem;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    outline:none;
    transition:all 0.3s var(--ease);
    min-width:150px;
}

.filter-select:focus{
    border-color:var(--gold);
    background:#12233d;
}

.filter-select option{
    background:#0D1829;
    color:var(--text);
}

.btn-add{
    padding:13px 22px;
    background:var(--grad-gold-shine);
    color:var(--bg);
    border:none;
    border-radius:12px;
    font-size:0.88rem;
    font-weight:700;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:all 0.3s var(--ease);
    white-space:nowrap;
    box-shadow:0 4px 15px var(--gold-glow);
}

.btn-add:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px var(--gold-glow);
}


/* ==================== CLIENT CARDS ==================== */
.client-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:16px;
}

.client-card{
    background:var(--grad-card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    transition:all 0.3s var(--ease);
    display:flex;
    flex-direction:column;
    gap:16px;
}

.client-card:hover{
    border-color:rgba(212,165,54,0.3);
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
    transform:translateY(-3px);
}

/* Card Top */
.card-top{
    display:flex;
    align-items:center;
    gap:14px;
}

.client-avatar{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.15rem;
    font-weight:900;
    font-family:'Montserrat',sans-serif;
    flex-shrink:0;
    color:#fff;
    position:relative;
}

.av-blue{background:linear-gradient(135deg,#3498db,#2980b9);}
.av-green{background:linear-gradient(135deg,#25d366,#1eb85a);}
.av-purple{background:linear-gradient(135deg,#9b59b6,#8e44ad);}
.av-gold{background:linear-gradient(135deg,var(--gold),#c19a2e);color:var(--bg);}
.av-red{background:linear-gradient(135deg,#e74c3c,#c0392b);}
.av-orange{background:linear-gradient(135deg,#f39c12,#e67e22);}
.av-cyan{background:linear-gradient(135deg,#1abc9c,#16a085);}
.av-pink{background:linear-gradient(135deg,#e91e8c,#c2185b);}

.card-info{
    flex:1;
    min-width:0;
}

.card-name{
    font-family:'Montserrat',sans-serif;
    font-size:1rem;
    font-weight:800;
    color:var(--text);
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-company{
    color:var(--text-muted);
    font-size:0.8rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status-badge{
    padding:5px 12px;
    border-radius:100px;
    font-size:0.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    flex-shrink:0;
    white-space:nowrap;
}

.st-active{
    background:rgba(37,211,102,0.12);
    color:#25d366;
    border:1px solid rgba(37,211,102,0.25);
}

.st-progress{
    background:rgba(52,152,219,0.12);
    color:#3498db;
    border:1px solid rgba(52,152,219,0.25);
}

.st-pending{
    background:rgba(243,156,18,0.12);
    color:#f39c12;
    border:1px solid rgba(243,156,18,0.25);
}

.st-done{
    background:rgba(155,89,182,0.12);
    color:#9b59b6;
    border:1px solid rgba(155,89,182,0.25);
}


/* Card Details */
.card-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:14px;
    background:rgba(0,0,0,0.2);
    border-radius:10px;
}

.detail-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    color:var(--text-muted);
    overflow:hidden;
}

.detail-row i{
    color:var(--gold);
    font-size:0.72rem;
    width:14px;
    text-align:center;
    flex-shrink:0;
}

.detail-row span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* Card Project Bar */
.card-project{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:rgba(212,165,54,0.05);
    border:1px solid rgba(212,165,54,0.12);
    border-radius:10px;
}

.card-project i{
    color:var(--gold);
    font-size:0.85rem;
    flex-shrink:0;
}

.card-project span{
    font-size:0.82rem;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
}

.card-project .proj-value{
    font-family:'Montserrat',monospace;
    font-size:0.78rem;
    font-weight:800;
    color:var(--gold);
    flex-shrink:0;
}


/* Card Actions */
.card-actions{
    display:flex;
    gap:8px;
    padding-top:4px;
    border-top:1px solid var(--border);
}

.card-btn{
    flex:1;
    padding:9px 8px;
    border-radius:10px;
    font-size:0.72rem;
    font-weight:700;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition:all 0.3s var(--ease);
    border:1px solid transparent;
    background:transparent;
}

.cb-view{
    border-color:rgba(52,152,219,0.3);
    color:#3498db;
}
.cb-view:hover{
    background:rgba(52,152,219,0.12);
    border-color:#3498db;
}

.cb-wa{
    border-color:rgba(37,211,102,0.3);
    color:#25d366;
}
.cb-wa:hover{
    background:rgba(37,211,102,0.12);
    border-color:#25d366;
}

.cb-edit{
    border-color:rgba(212,165,54,0.3);
    color:var(--gold);
}
.cb-edit:hover{
    background:rgba(212,165,54,0.12);
    border-color:var(--gold);
}

.cb-del{
    border-color:rgba(231,76,60,0.3);
    color:#e74c3c;
}
.cb-del:hover{
    background:rgba(231,76,60,0.12);
    border-color:#e74c3c;
}


/* ==================== EMPTY STATE ==================== */
.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    background:var(--grad-card);
    border:2px dashed var(--border);
    border-radius:var(--radius-lg);
}

.empty-state .empty-icon{
    font-size:4rem;
    margin-bottom:16px;
    opacity:0.3;
    display:block;
}

.empty-state h3{
    font-family:'Montserrat',sans-serif;
    font-size:1.2rem;
    font-weight:800;
    color:var(--text);
    margin-bottom:8px;
}

.empty-state p{
    color:var(--text-muted);
    font-size:0.85rem;
    margin-bottom:24px;
    line-height:1.6;
}

.btn-empty-add{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 28px;
    background:var(--grad-gold-shine);
    color:var(--bg);
    border:none;
    border-radius:100px;
    font-size:0.9rem;
    font-weight:700;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    transition:all 0.3s var(--ease);
    box-shadow:0 6px 20px var(--gold-glow);
}

.btn-empty-add:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px var(--gold-glow);
}


/* ==================== MODAL ==================== */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    transition:opacity 0.3s ease;
}

.modal-overlay.show{
    display:flex;
    opacity:1;
}

.modal-box{
    background:linear-gradient(145deg,#0F1E33,#0A1626);
    border:1px solid rgba(212,165,54,0.2);
    border-radius:20px;
    width:100%;
    max-width:540px;
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(24px) scale(0.97);
    transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 40px rgba(212,165,54,0.1);
}

.modal-overlay.show .modal-box{
    transform:translateY(0) scale(1);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 24px;
    border-bottom:1px solid var(--border);
}

.modal-head h3{
    font-family:'Montserrat',sans-serif;
    font-size:1.1rem;
    font-weight:800;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
}

.modal-close-btn{
    width:36px;
    height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.95rem;
    transition:all 0.3s ease;
}

.modal-close-btn:hover{
    border-color:#e74c3c;
    color:#e74c3c;
    background:rgba(231,76,60,0.1);
}

.modal-body{
    padding:24px;
}

.modal-foot{
    display:flex;
    gap:10px;
    padding:20px 24px;
    border-top:1px solid var(--border);
    justify-content:flex-end;
}

/* Form elements inside modal */
.form-group{
    margin-bottom:16px;
}

.form-label{
    display:block;
    font-size:0.8rem;
    font-weight:700;
    color:var(--gold);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
    text-transform:uppercase;
    letter-spacing:0.5px;
}

.form-label i{
    font-size:0.78rem;
    width:14px;
    opacity:0.8;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;
    padding:13px 16px;
    background:#0D1829;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    color:var(--text);
    font-size:0.9rem;
    font-family:'Poppins',sans-serif;
    transition:all 0.3s var(--ease);
    outline:none;
    box-sizing:border-box;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    background:#12233d;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,165,54,0.1);
}

.form-input::placeholder,
.form-textarea::placeholder{
    color:var(--text-muted);
}

.form-select option{
    background:#0D1829;
    color:var(--text);
}

.form-textarea{
    resize:vertical;
    min-height:80px;
    line-height:1.5;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.required{
    color:#e74c3c;
    margin-left:2px;
}


/* Modal Buttons */
.btn-cancel{
    padding:11px 22px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:100px;
    color:var(--text-muted);
    font-size:0.85rem;
    font-weight:700;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    transition:all 0.3s ease;
}

.btn-cancel:hover{
    border-color:var(--text-muted);
    color:var(--text);
}

.btn-save{
    padding:11px 26px;
    background:var(--grad-gold-shine);
    color:var(--bg);
    border:none;
    border-radius:100px;
    font-size:0.85rem;
    font-weight:800;
    font-family:'Poppins',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:all 0.3s var(--ease);
    box-shadow:0 4px 15px var(--gold-glow);
}

.btn-save:hover{
    box-shadow:0 8px 25px var(--gold-glow);
    transform:translateY(-1px);
}


/* ==================== DETAIL MODAL ==================== */
.detail-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.detail-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 14px;
    background:#0D1829;

function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return hash.toString(36) + str.length.toString(36);
}

function checkAuth() {
    const session = localStorage.getItem('ibaad_session');
    if (!session) { window.location.href = 'dashboard-login.html'; return false; }
    try {
        const data = JSON.parse(session);
        if (Date.now() > data.expiry) {
            localStorage.removeItem('ibaad_session');
            Swal.fire({
                icon:'warning', title:'Sesi Berakhir',
                text:'Silakan login kembali untuk melanjutkan',
                customClass:{popup:'swal-premium'},
                confirmButtonText:'Login Ulang', allowOutsideClick:false
            }).then(() => { window.location.href = 'dashboard-login.html'; });
            return false;
        }
        const validToken = simpleHash(CREDENTIALS.username + CREDENTIALS.password);
        if (data.token !== validToken) {
            localStorage.removeItem('ibaad_session');
            window.location.href = 'dashboard-login.html';
            return false;
        }
        return data;
    } catch(e) {
        window.location.href = 'dashboard-login.html';
        return false;

// ====================================================
// HELPERS
// ====================================================
const AVATAR_COLORS = ['av-blue','av-green','av-purple','av-gold','av-red','av-orange','av-cyan','av-pink'];

function getAvatarClass(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function getInitials(name) {
    const p = name.trim().split(' ');
    return p.length >= 2
        ? (p[0][0] + p[1][0]).toUpperCase()
        : name.substring(0, 2).toUpperCase();
}

const STATUS_MAP = {
    active:  { label:'Aktif',       cls:'st-active'   },
    progress:{ label:'In Progress', cls:'st-progress'  },
    pending: { label:'Pending',     cls:'st-pending'   },
    done:    { label:'Selesai',     cls:'st-done'      }
};

function statusBadge(s) {
    const m = STATUS_MAP[s] || STATUS_MAP.pending;
    return `<span class="status-badge ${m.cls}">${m.label}</span>`;
}

function safeWaNum(phone) {
    return phone.replace(/^0/, '62').replace(/[^0-9]/g, '');
}

function escHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function autoFormatRp(input) {
    let v = input.value.replace(/[^0-9]/g, '');
    input.value = v ? 'Rp ' + parseInt(v).toLocaleString('id-ID') : '';
}


// ====================================================
// STATS

function updateStats(data) {
    document.getElementById('stTotal').textContent    = data.length;
    document.getElementById('stActive').textContent   = data.filter(c => c.status === 'active').length;
    document.getElementById('stProgress').textContent = data.filter(c => c.status === 'progress').length;
    document.getElementById('stDone').textContent     = data.filter(c => c.status === 'done').length;
}


// ====================================================
// RENDER
// ====================================================
function renderClients() {
    const data     = getData();
    const query    = document.getElementById('searchInput').value.toLowerCase();
    const filter   = document.getElementById('filterStatus').value;
    const grid     = document.getElementById('clientGrid');

    updateStats(data);

    const list = data.filter(c => {
        const matchQ = !query
            || c.name.toLowerCase().includes(query)
            || (c.company  && c.company.toLowerCase().includes(query))
            || (c.project  && c.project.toLowerCase().includes(query))
            || (c.phone    && c.phone.includes(query));
        const matchF = filter === 'all' || c.status === filter;
        return matchQ && matchF;
    });

    if (!list.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <span class="empty-icon">🗂️</span>
                <h3>${query || filter !== 'all' ? 'Data Tidak Ditemukan' : 'Belum Ada Client'}</h3>
                <p>${query || filter !== 'all'
                    ? 'Coba ubah kata kunci atau filter status'
                    : 'Mulai tambahkan client pertama kamu!'}</p>
                ${!query && filter === 'all'
                    ? `<button class="btn-empty-add" onclick="openModal('add')">
                           <i class="fas fa-plus"></i> Tambah Client Pertama
                       </button>` : ''}
            </div>`;
        return;
    }

    grid.innerHTML = list.map(c => {
        const realIdx = data.indexOf(c);
        const avCls   = getAvatarClass(c.name);
        const m       = STATUS_MAP[c.status] || STATUS_MAP.pending;

        return `
        <div class="client-card">

            <div class="card-top">
                <div class="client-avatar ${avCls}">${escHtml(getInitials(c.name))}</div>
                <div class="card-info">
                    <div class="card-name">${escHtml(c.name)}</div>
                    <div class="card-company">${escHtml(c.company || 'Individual')}</div>
                </div>
                <span class="status-badge ${m.cls}">${m.label}</span>
            </div>

            <div class="card-project">
                <i class="fas fa-code"></i>
                <span>${escHtml(c.project || '-')}</span>
                <span class="proj-value">${escHtml(c.value || '-')}</span>
            </div>

            <div class="card-details">
                <div class="detail-row">
                    <i class="fas fa-phone"></i>
                    <span>${escHtml(c.phone || '-')}</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-envelope"></i>
                    <span>${escHtml(c.email || '-')}</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-calendar-plus"></i>
                    <span>${escHtml(c.createdAt || '-')}</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-sticky-note"></i>
                    <span>${escHtml(c.notes ? c.notes.substring(0, 30) + (c.notes.length > 30 ? '…' : '') : '-')}</span>
                </div>
            </div>

            <div class="card-actions">
                <button class="card-btn cb-view"  onclick="viewClient(${realIdx})">
                    <i class="fas fa-eye"></i> Detail
                </button>
                <button class="card-btn cb-wa"    onclick="waClient(${realIdx})">
                    <i class="fab fa-whatsapp"></i> Chat
                </button>
                <button class="card-btn cb-edit"  onclick="openModal('edit',${realIdx})">
                    <i class="fas fa-edit"></i> Edit
                </button>
                <button class="card-btn cb-del"   onclick="deleteClient(${realIdx})">
                    <i class="fas fa-trash"></i> Hapus
                </button>
            </div>

        </div>`;
    }).join('');
}


// ====================================================
// MODAL OPEN / CLOSE
// ====================================================
function openModal(mode, idx = -1) {
    if (mode === 'add') {
        document.getElementById('modalFormTitle').textContent = 'Tambah Client Baru';
        document.getElementById('modalFormIcon').className   = 'fas fa-user-plus';
        document.getElementById('editIdx').value = -1;
        clearForm();
    } else {
        const c = getData()[idx];
        if (!c) return;
        document.getElementById('modalFormTitle').textContent = 'Edit Client';
        document.getElementById('modalFormIcon').className   = 'fas fa-user-edit';
        document.getElementById('editIdx').value = idx;
        document.getElementById('fName').value    = c.name    || '';
        document.getElementById('fCompany').value = c.company || '';
        document.getElementById('fPhone').value   = c.phone   || '';
        document.getElementById('fEmail').value   = c.email   || '';
        document.getElementById('fProject').value = c.project || '';
        document.getElementById('fValue').value   = c.value   || '';
        document.getElementById('fStatus').value  = c.status  || 'pending';
        document.getElementById('fNotes').value   = c.notes   || '';
    }
    showOverlay('modalForm');
}

function closeModal(id) {
    const el = document.getElementById(id);
    el.classList.remove('show');
    setTimeout(() => { el.style.display = 'none'; }, 300);
    document.body.style.overflow = '';
}

function showOverlay(id) {
    const el = document.getElementById(id);
    el.style.display = 'flex';
    requestAnimationFrame(() => el.classList.add('show'));
    document.body.style.overflow = 'hidden';
}

// Close on backdrop click
document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => {
        if (e.target === el) closeModal(el.id);
    });
});

function clearForm() {
    ['fName','fCompany','fPhone','fEmail','fProject','fValue','fNotes']
        .forEach(id => document.getElementById(id).value = '');
    document.getElementById('fStatus').value = 'pending';
}


// ====================================================
// SAVE
// ====================================================
function saveClient() {
    const name    = document.getElementById('fName').value.trim();
    const phone   = document.getElementById('fPhone').value.trim();
    const project = document.getElementById('fProject').value.trim();

    if (!name) {
        Swal.fire({
            icon:'warning', title:'Data Kurang',
            text:'Nama client wajib diisi!',
            customClass:{popup:'swal-premium'}, confirmButtonText:'Oke'
        });
        return;
    }
    if (!phone) {
        Swal.fire({
            icon:'warning', title:'Data Kurang',
            text:'Nomor WhatsApp wajib diisi!',
            customClass:{popup:'swal-premium'}, confirmButtonText:'Oke'
        });
        return;
    }
    if (!project) {
        Swal.fire({
            icon:'warning', title:'Data Kurang',
            text:'Nama project wajib diisi!',
            customClass:{popup:'swal-premium'}, confirmButtonText:'Oke'
        });
        return;
    }

    const data   = getData();
    const idx    = parseInt(document.getElementById('editIdx').value);
    const isEdit = idx >= 0 && data[idx];

    const payload = {
        name    : name,
        company : document.getElementById('fCompany').value.trim(),
        phone   : phone,
        email   : document.getElementById('fEmail').value.trim(),
        project : project,
        value   : document.getElementById('fValue').value.trim(),
        status  : document.getElementById('fStatus').value,
        notes   : document.getElementById('fNotes').value.trim(),
        createdAt: isEdit ? data[idx].createdAt : new Date().toISOString().split('T')[0]
    };

    if (isEdit) {
        data[idx] = payload;
    } else {
        data.unshift(payload);
    }

    setData(data);
    closeModal('modalForm');
    renderClients();

    Swal.fire({
        icon:'success',
        title: isEdit ? '✅ Client Diperbarui' : '🎉 Client Ditambahkan',
        text : isEdit ? `Data ${name} berhasil diupdate` : `${name} berhasil ditambahkan`,
        customClass:{popup:'swal-premium'},
        timer:2000, showConfirmButton:false, timerProgressBar:true,
        toast:true, position:'top-end'
    });
}


// ====================================================
// VIEW DETAIL
// ====================================================
function viewClient(idx) {
    const c = getData()[idx];
    if (!c) return;

    const m = STATUS_MAP[c.status] || STATUS_MAP.pending;

    const rows = [
        { icon:'fas fa-user',          label:'Nama',       value: escHtml(c.name) },
        { icon:'fas fa-building',      label:'Perusahaan', value: escHtml(c.company || '-') },
        { icon:'fab fa-whatsapp',      label:'WhatsApp',   value: escHtml(c.phone || '-') },
        { icon:'fas fa-envelope',      label:'Email',      value: escHtml(c.email || '-') },
        { icon:'fas fa-code',          label:'Project',    value: escHtml(c.project || '-') },
        { icon:'fas fa-money-bill-wave',label:'Nilai',     value: escHtml(c.value || '-') },
        { icon:'fas fa-flag',          label:'Status',     value: `<span class="status-badge ${m.cls}">${m.label}</span>` },
        { icon:'fas fa-calendar-plus', label:'Ditambahkan',value: escHtml(c.createdAt || '-') },
        ...(c.notes ? [{ icon:'fas fa-sticky-note', label:'Catatan', value: escHtml(c.notes) }] : [])
    ];

    document.getElementById('detailList').innerHTML = rows.map(r => `
        <div class="detail-item">
            <div class="detail-item-icon"><i class="${r.icon}"></i></div>
            <div class="detail-item-text">
                <div class="dit-label">${r.label}</div>
                <div class="dit-value">${r.value}</div>
            </div>
        </div>
    `).join('');

    // Wire up Edit button inside detail modal
    document.getElementById('detailEditBtn').onclick = () => {
        closeModal('modalDetail');
        setTimeout(() => openModal('edit', idx), 350);
    };

    showOverlay('modalDetail');
}


// ====================================================
// WHATSAPP
// ====================================================
function waClient(idx) {
    const c = getData()[idx];
    if (!c || !c.phone) {
        Swal.fire({
            icon:'error', title:'Nomor Tidak Ada',
            text:'Client ini tidak memiliki nomor WhatsApp',
            customClass:{popup:'swal-premium'}, confirmButtonText:'Oke'
        });
        return;
    }
    const num = safeWaNum(c.phone);
    const msg = encodeURIComponent(
        `Halo *${c.name}* 👋\n\n` +
        `Saya dari *Ibaadurrahmaan Web Designer*.\n` +
        `Mau follow up mengenai project _"${c.project}"_.\n\n` +
        `Ada yang bisa saya bantu? 😊`
    );
    window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
}


// ====================================================
// DELETE
// ====================================================
function deleteClient(idx) {
    const data = getData();
    const c    = data[idx];
    if (!c) return;

    Swal.fire({
        icon:'warning',
        title:'Hapus Client?',
        html:`Client <b style="color:#e74c3c;">${escHtml(c.name)}</b> akan dihapus permanen.<br>
              Data tidak bisa dikembalikan!`,
        showCancelButton:true,
        confirmButtonText:'<i class="fas fa-trash"></i> Ya, Hapus',
        cancelButtonText:'Batal',
        customClass:{popup:'swal-premium'},
        reverseButtons:true, focusCancel:true
    }).then(r => {
        if (r.isConfirmed) {
            data.splice(idx, 1);
            setData(data);
            renderClients();
            Swal.fire({
                icon:'success', title:'Terhapus!',
                text:`${c.name} berhasil dihapus`,
                customClass:{popup:'swal-premium'},
                timer:2000, showConfirmButton:false, timerProgressBar:true,
                toast:true, position:'top-end'
            });
        }
    });
}


// ====================================================
// INIT
// ====================================================
window.addEventListener('load', () => {
    renderClients();

    // Inject user info dari session
    if (session) {
        const username    = session.username || 'Owner';
        const displayName = username.charAt(0).toUpperCase() + username.slice(1);
        document.getElementById('userName').textContent  = displayName;
        document.getElementById('userAvatar').textContent = displayName.charAt(0);
    }
});
</script>
